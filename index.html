<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Equipment Platform - Boss Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --boss-red: #cc2027;
            --boss-black: #111111;
            --boss-gray: #f4f4f4;
            --text-dark: #333;
            --text-light: #777;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--boss-gray);
            color: var(--text-dark);
        }

        header {
            background-color: var(--boss-black);
            color: #fff;
            padding: 15px 40px;
            border-bottom: 4px solid var(--boss-red);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        .filter-group {
            background: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter-group h3 {
            margin-top: 0;
            font-size: 15px;
            border-bottom: 2px solid var(--boss-gray);
            padding-bottom: 8px;
            color: var(--boss-black);
            text-transform: uppercase;
        }

        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }

        .main-content {
            flex-grow: 1;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .tab {
            padding: 12px 25px;
            background-color: #fff;
            border: 1px solid #ddd;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 14px;
        }

        .tab.active {
            background-color: var(--boss-red);
            color: #fff;
            border-color: var(--boss-red);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            position: relative;
            display: flex;
            flex-direction: column;
            border-top: 3px solid transparent;
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-3px);
            border-top-color: var(--boss-red);
        }

        /* Stijl voor afgelopen veilingen (transparant grijs vlak en klikbaar houden) */
        .card.expired {
            opacity: 0.55;
            background-color: #e9e9e9;
        }
        .card.expired:hover {
            transform: none;
            border-top-color: transparent;
        }

        .card-image-container {
            position: relative;
            height: 180px;
            background-color: #e9e9e9;
        }

        .card-image-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
            font-weight: bold;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
            z-index: 2;
            color: #fff;
        }

        .badge-op-voorraad {
            background-color: #28a745;
        }

        .badge-rood {
            background-color: var(--boss-red);
        }

        .badge-urgent {
            background-color: var(--boss-red);
            color: #fff;
            animation: pulse-urgent 1.5s infinite;
        }

        @keyframes pulse-urgent {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .badge-default {
            background-color: var(--boss-black);
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 17px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--boss-black);
        }

        .card-specs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-light);
            flex-wrap: wrap;
        }

        .spec-tag {
            background: var(--boss-gray);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .card-location {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-location img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 2px;
        }

        .card-price-box {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .card-price {
            font-size: 20px;
            font-weight: 900;
        }

        .old-price {
            text-decoration: line-through;
            color: #999;
            font-size: 14px;
            margin-right: 8px;
        }

        .new-price {
            color: var(--boss-red);
        }

        .countdown {
            margin-top: 10px;
            padding: 8px;
            background-color: #fff3f3;
            border: 1px solid var(--boss-red);
            border-radius: 4px;
            color: var(--boss-red);
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .card-link {
            display: block;
            text-align: center;
            background: var(--boss-black);
            color: #fff;
            text-decoration: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 12px;
            border-radius: 4px;
        }

        .card-link:hover {
            background: var(--boss-red);
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="BOSS GLOBAL" style="height: 45px; object-fit: contain; display: block;">
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Platform</h3>
                <select id="filter-platform" onchange="renderGrid()">
                    <option value="">Alle platforms</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Merk</h3>
                <select id="filter-merk" onchange="renderGrid()">
                    <option value="">Alle merken</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Bouwjaar</h3>
                <select id="filter-bouwjaar" onchange="renderGrid()">
                    <option value="">Alle bouwjaren</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Status</h3>
                <select id="filter-status" onchange="renderGrid()">
                    <option value="">Alle statussen</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('listings')" id="tab-listings">Listings</div>
                <div class="tab" onclick="switchTab('auctions')" id="tab-auctions">Veilingen</div>
            </div>

            <div class="grid" id="product-grid">
                <p>Gegevens ophalen uit Google Sheets...</p>
            </div>
        </main>
    </div>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2MZR5mkooWA08Y3GcQAbkAK_SjN0lORb5mth5VVI0fu54XFjksN9HFH_drlAii3O3MYNiCz0OvLbZ/pub?gid=0&single=true&output=csv';
        
        let allData = [];
        let currentTab = 'listings';

        Papa.parse(sheetCSVUrl, {
            download: true,
            header: true,
            complete: function(results) {
                allData = results.data.filter(row => row.Merk && row.Model);
                populateFilters();
                renderGrid();
            },
            error: function(err) {
                document.getElementById('product-grid').innerHTML = `<p style="color:red;">Fout bij laden van Google Sheet: ${err.message}</p>`;
            }
        });

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-listings').classList.toggle('active', tab === 'listings');
            document.getElementById('tab-auctions').classList.toggle('active', tab === 'auctions');
            renderGrid();
        }

        function populateFilters() {
            const platforms = [...new Set(allData.map(item => item.Platform))].filter(Boolean).sort();
            const merken = [...new Set(allData.map(item => item.Merk))].filter(Boolean).sort();
            const bouwjaren = [...new Set(allData.map(item => item.Bouwjaar))].filter(Boolean).sort((a,b)=>b-a);
            const statussen = [...new Set(allData.map(item => item.Status))].filter(Boolean).sort();

            const fillSelect = (id, arr) => {
                const select = document.getElementById(id);
                if (id === 'filter-platform') select.innerHTML = '<option value="">Alle platforms</option>';
                if (id === 'filter-merk') select.innerHTML = '<option value="">Alle merken</option>';
                if (id === 'filter-bouwjaar') select.innerHTML = '<option value="">Alle bouwjaren</option>';
                if (id === 'filter-status') select.innerHTML = '<option value="">Alle statussen</option>';

                arr.forEach(val => select.innerHTML += `<option value="${val}">${val}</option>`);
            };

            fillSelect('filter-platform', platforms);
            fillSelect('filter-merk', merken);
            fillSelect('filter-bouwjaar', bouwjaren);
            fillSelect('filter-status', statussen);
        }

        function getCountryFlagHtml(locStr) {
            if (!locStr) return '';
            let l = locStr.toLowerCase();
            let countryCode = '';

            if (l.includes(', si') || l.includes('slovenia') || l.includes('slovenië') || l.includes('ajdovscina')) {
                countryCode = 'si';
            } else if (l.includes('netherlands') || l.includes('nederland') || l.includes('holland') || l.includes(', nl')) {
                countryCode = 'nl';
            } else if (l.includes('germany') || l.includes('duitsland') || l.includes('deutschland') || l.includes(', de')) {
                countryCode = 'de';
            } else if (l.includes('france') || l.includes('frankrijk') || l.includes(', fr')) {
                countryCode = 'fr';
            } else if (l.includes('belgium') || l.includes('belgië') || l.includes('belgique') || l.includes(', be')) {
                countryCode = 'be';
            } else if (l.includes('italy') || l.includes('italië') || l.includes('italia') || l.includes(', it')) {
                countryCode = 'it';
            } else if (l.includes('spain') || l.includes('spanje') || l.includes('españa') || l.includes(', es')) {
                countryCode = 'es';
            } else if (l.includes('poland') || l.includes('polen') || l.includes(', pl')) {
                countryCode = 'pl';
            }

            if (countryCode) {
                return `<img src="https://flagcdn.com/24x18/${countryCode}.png" alt="${countryCode}">`;
            }
            return '📍';
        }

        // Geoptimaliseerde datum parser ter ondersteuning van zowel ISO als oude/assign notaties
        function parseAuctionDate(str) {
            if (!str) return null;
            str = String(str).replace(/^'/, '').trim();

            // 1. ISO format (bijv: 2026-10-15T12:01:00+0200)
            if (str.includes('T')) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) return d;
            }

            // 2. Countdown format
            if (/^\d+:\d{2}:\d{2}$/.test(str)) {
                const parts = str.split(':').map(Number);
                const ms = (parts[0] * 3600 + parts[1] * 60 + parts[2]) * 1000;
                return new Date(Date.now() + ms);
            }

            // 3. Verwijder prefixen zoals "assign.:" of "Startet"
            if (str.toLowerCase().startsWith('assign.:')) {
                str = str.substring(8).trim();
            }

            if (/heute\s+um/i.test(str)) {
                const timeMatch = str.match(/(\d{2}):(\d{2})/);
                const hours = timeMatch ? parseInt(timeMatch[1]) : 12;
                const minutes = timeMatch ? parseInt(timeMatch[2]) : 0;
                const targetDate = new Date();
                targetDate.setHours(hours, minutes, 0, 0);
                return targetDate;
            }

            const weekDays = {
                'montag': 1, 'maandag': 1,
                'dienstag': 2, 'dinsdag': 2,
                'mittwoch': 3, 'woensdag': 3,
                'donnerstag': 4, 'donderdag': 4,
                'freitag': 5, 'vrijdag': 5,
                'samstag': 6, 'zaterdag': 6,
                'sonntag': 0, 'zondag': 0
            };

            const lowerStr = str.toLowerCase();
            for (const [dayName, targetDayIndex] of Object.entries(weekDays)) {
                if (lowerStr.includes(dayName)) {
                    const timeMatch = str.match(/(\d{2}):(\d{2})/);
                    const hours = timeMatch ? parseInt(timeMatch[1]) : 12;
                    const minutes = timeMatch ? parseInt(timeMatch[2]) : 0;

                    const now = new Date();
                    const currentDayIndex = now.getDay();
                    let dayDiff = targetDayIndex - currentDayIndex;
                    if (dayDiff <= 0) dayDiff += 7;

                    const targetDate = new Date(now);
                    targetDate.setDate(now.getDate() + dayDiff);
                    targetDate.setHours(hours, minutes, 0, 0);
                    return targetDate;
                }
            }

            // 4. Europese datumnotatie (bijv: 30-09-2026, 14:15 of 30-09-2026 14:15)
            const euMatch = str.match(/^(\d{2})-(\d{2})-(\d{4})[, ]*\s*(\d{2}):(\d{2})$/);
            if (euMatch) {
                const [, d, m, y, hh, mm] = euMatch;
                return new Date(`${y}-${m}-${d}T${hh}:${mm}:00`);
            }

            let cleanStr = str
                .replace(/Startet\s+/i, '')
                .replace(/um/i, '')
                .replace(/\./g, '')
                .trim();

            const months = {
                'jan': 'Jan', 'feb': 'Feb', 'mär': 'Mar', 'mar': 'Mar', 'apr': 'Apr',
                'mai': 'May', 'may': 'May', 'jun': 'Jun', 'jul': 'Jul', 'aug': 'Aug',
                'sep': 'Sep', 'okt': 'Oct', 'oct': 'Oct', 'nov': 'Nov', 'dez': 'Dec', 'dec': 'Dec'
            };

            for (const [nl, en] of Object.entries(months)) {
                const regex = new RegExp(nl, 'i');
                if (regex.test(cleanStr)) {
                    cleanStr = cleanStr.replace(regex, en);
                    break;
                }
            }

            if (!/\d{4}/.test(cleanStr)) {
                cleanStr += ' 2026';
            }

            const parsed = new Date(cleanStr);
            if (!isNaN(parsed.getTime())) return parsed;

            return null;
        }

        function getCountdownDetails(endTimeString) {
            const end = parseAuctionDate(endTimeString);
            if (!end) return null;

            const now = new Date();
            const diff = end - now;

            if (diff <= 0) return { text: 'Veiling afgelopen', isUrgent: false, timeValue: diff };

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            const pad = (n) => String(n).padStart(2, '0');

            if (diff < 12 * 60 * 60 * 1000) {
                return {
                    text: `⚠️ ${pad(hours)}u ${pad(minutes)}m ${pad(seconds)}s`,
                    isUrgent: true,
                    timeValue: diff
                };
            }

            let text = days > 0 ? `Nog ${days}d ${hours}u` : `Nog ${hours}u ${minutes}m`;
            return { text: `⏱ ${text}`, isUrgent: false, timeValue: diff };
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filterPlatform = document.getElementById('filter-platform').value;
            const filterMerk = document.getElementById('filter-merk').value;
            const filterBouwjaar = document.getElementById('filter-bouwjaar').value;
            const filterStatus = document.getElementById('filter-status').value;

            let filteredData = allData.filter(row => {
                const endDateVal = row['Veiling loopt af op'] ? row['Veiling loopt af op'].trim() : '';
                const isAuction = endDateVal !== '';

                if (currentTab === 'listings' && isAuction) return false;
                if (currentTab === 'auctions' && !isAuction) return false;

                if (filterPlatform && row.Platform !== filterPlatform) return false;
                if (filterMerk && row.Merk !== filterMerk) return false;
                if (filterBouwjaar && row.Bouwjaar !== filterBouwjaar) return false;
                if (filterStatus && row.Status !== filterStatus) return false;

                return true;
            });

            // Sortering aanpassen: lopende veilingen op tijd, afgelopen veilingen en verkochte items altijd onderaan
            filteredData.sort((a, b) => {
                if (currentTab === 'auctions') {
                    const dateA = parseAuctionDate(a['Veiling loopt af op']);
                    const dateB = parseAuctionDate(b['Veiling loopt af op']);
                    const now = new Date();

                    const isExpiredA = !dateA || (dateA - now <= 0);
                    const isExpiredB = !dateB || (dateB - now <= 0);

                    // Als A is afgelopen en B niet, zet A onderaan (+1)
                    if (isExpiredA && !isExpiredB) return 1;
                    if (!isExpiredA && isExpiredB) return -1;

                    // Beide actief of beide verlopen: sorteer op tijd
                    if (!dateA) return 1;
                    if (!dateB) return -1;
                    return dateA - dateB;
                } else {
                    // Voor listings: "Verkocht" items automatisch onderaan plaatsen
                    const statusA = (a['Status'] || '').toLowerCase();
                    const statusB = (b['Status'] || '').toLowerCase();
                    const isSoldA = statusA.includes('verkocht');
                    const isSoldB = statusB.includes('verkocht');

                    if (isSoldA && !isSoldB) return 1;
                    if (!isSoldA && isSoldB) return -1;
                    return 0;
                }
            });

            if (filteredData.length === 0) {
                grid.innerHTML = '<p>Geen machines gevonden met deze filters.</p>';
                return;
            }

            filteredData.forEach(row => {
                const endDateVal = row['Veiling loopt af op'] ? row['Veiling loopt af op'].trim() : '';
                const isAuction = endDateVal !== '';

                let priceHtml = '';
                const eerstePrijs = row['Eerste prijs'] ? row['Eerste prijs'].trim() : '';
                const laatstePrijs = row['Laatste prijs'] ? row['Laatste prijs'].trim() : '';

                if (laatstePrijs && eerstePrijs && eerstePrijs !== laatstePrijs) {
                    priceHtml = `<div class="card-price"><span class="old-price">${eerstePrijs}</span> <span class="new-price">${laatstePrijs}</span></div>`;
                } else if (laatstePrijs) {
                    priceHtml = `<div class="card-price">${laatstePrijs}</div>`;
                } else if (eerstePrijs) {
                    priceHtml = `<div class="card-price">${eerstePrijs}</div>`;
                } else {
                    priceHtml = `<div class="card-price">${isAuction ? 'Actueel bod' : 'Op aanvraag'}</div>`;
                }

                let badgeHtml = '';
                let auctionHtml = '';
                let isExpired = false;

                if (isAuction) {
                    const countdownObj = getCountdownDetails(row['Veiling loopt af op']);
                    if (countdownObj) {
                        const bidsCount = row['Aantal biedingen'] || '0';
                        if (countdownObj.text === 'Veiling afgelopen') {
                            badgeHtml = `<div class="badge badge-rood">Afgelopen</div>`;
                            auctionHtml = `<div class="countdown" style="background:#eee; color:#666; border-color:#ccc;">Veiling afgelopen | Biedingen: ${bidsCount}</div>`;
                            isExpired = true;
                        } else if (countdownObj.isUrgent) {
                            badgeHtml = `<div class="badge badge-urgent">${countdownObj.text}</div>`;
                            auctionHtml = `<div class="countdown">${countdownObj.text} | Biedingen: ${bidsCount}</div>`;
                        } else {
                            auctionHtml = `<div class="countdown">${countdownObj.text} | Biedingen: ${bidsCount}</div>`;
                        }
                    }
                } else if (row.Status) {
                    let statusLower = row.Status.toLowerCase().trim();
                    let badgeClass = 'badge-default';

                    if (statusLower.includes('voorraad')) {
                        badgeClass = 'badge-op-voorraad';
                    } else if (statusLower.includes('afgeprijsd') || statusLower.includes('bod verhoogd')) {
                        badgeClass = 'badge-rood';
                    }
                    badgeHtml = `<div class="badge ${badgeClass}">${row.Status}</div>`;
                }

                let imageUrl = row['Image URL'] || row['image url'] || row['image_url'] || '';
                let imageHtml = `<div class="card-image-placeholder">Geen afbeelding</div>`;
                if (imageUrl.trim() !== '') {
                    imageHtml = `<div class="card-image"><img src="${imageUrl.trim()}" alt="${row.Merk} ${row.Model}" style="width:100%; height:180px; object-fit:cover; display:block;" onerror="this.parentElement.innerHTML='<div class=\'card-image-placeholder\'>Geen afbeelding</div>'"></div>`;
                }

                let locationHtml = '';
                if (row['Locatie']) {
                    let flagHtml = getCountryFlagHtml(row['Locatie']);
                    locationHtml = `<div class="card-location">${flagHtml} <span>${row['Locatie']}</span></div>`;
                }

                const productUrl = row.Link ? row.Link : '#';
                const expiredClass = isExpired ? ' expired' : '';

                const card = `
                    <a href="${productUrl}" target="_blank" rel="noopener noreferrer" class="card${expiredClass}">
                        ${badgeHtml}
                        <div class="card-image-container">
                            ${imageHtml}
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${row.Merk} ${row.Model}</h3>
                            <div class="card-specs">
                                ${row.Bouwjaar ? `<span class="spec-tag">Bouwjaar: ${row.Bouwjaar}</span>` : ''}
                                ${row.Draaiuren ? `<span class="spec-tag">Uren: ${row.Draaiuren}</span>` : ''}
                            </div>
                            ${locationHtml}
                            <div class="card-price-box">
                                ${priceHtml}
                            </div>
                            ${auctionHtml}
                            <span class="card-link">Bekijk machine</span>
                        </div>
                    </a>
                `;
                grid.innerHTML += card;
            });
        }

        // Live update elke seconde voor vloeiend aftellende seconden
        setInterval(() => {
            if (currentTab === 'auctions') {
                renderGrid();
            }
        }, 1000);
    </script>
</body>
</html>
