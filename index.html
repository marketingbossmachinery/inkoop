<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Platform - Boss Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --boss-red: #cc2027;
            --boss-black: #111111;
            --boss-gray: #f4f4f4;
            --text-dark: #333;
            --text-light: #777;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--boss-gray);
            color: var(--text-dark);
        }

        header {
            background-color: var(--boss-black);
            color: #fff;
            padding: 15px 40px;
            border-bottom: 4px solid var(--boss-red);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        .filter-group {
            background: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter-group h3 {
            margin-top: 0;
            font-size: 15px;
            border-bottom: 2px solid var(--boss-gray);
            padding-bottom: 8px;
            color: var(--boss-black);
            text-transform: uppercase;
        }

        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }

        .main-content {
            flex-grow: 1;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .tab {
            padding: 12px 25px;
            background-color: #fff;
            border: 1px solid #ddd;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 14px;
        }

        .tab.active {
            background-color: var(--boss-red);
            color: #fff;
            border-color: var(--boss-red);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            position: relative;
            display: flex;
            flex-direction: column;
            border-top: 3px solid transparent;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-top-color: var(--boss-red);
        }

        .card-image-placeholder {
            height: 180px;
            background-color: #e9e9e9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
            font-weight: bold;
        }

        /* Badge Stijlen */
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
            z-index: 2;
            color: #fff;
        }

        .badge-op-voorraad {
            background-color: #28a745; /* Groen */
        }

        .badge-rood {
            background-color: var(--boss-red); /* Rood voor Afgeprijsd & Bod verhoogd */
        }

        .badge-default {
            background-color: var(--boss-black);
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 17px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--boss-black);
        }

        .card-specs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--text-light);
            flex-wrap: wrap;
        }

        .spec-tag {
            background: var(--boss-gray);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .card-price-box {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .card-price {
            font-size: 20px;
            font-weight: 900;
        }

        .old-price {
            text-decoration: line-through;
            color: #999;
            font-size: 14px;
            margin-right: 8px;
        }

        .new-price {
            color: var(--boss-red);
        }

        .countdown {
            margin-top: 10px;
            padding: 8px;
            background-color: #fff3f3;
            border: 1px solid var(--boss-red);
            border-radius: 4px;
            color: var(--boss-red);
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .card-link {
            display: block;
            text-align: center;
            background: var(--boss-black);
            color: #fff;
            text-decoration: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 12px;
            border-radius: 4px;
        }

        .card-link:hover {
            background: var(--boss-red);
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="BOSS GLOBAL" style="height: 45px; object-fit: contain; display: block;">
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Platform</h3>
                <select id="filter-platform" onchange="renderGrid()">
                    <option value="">Alle platforms</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Merk</h3>
                <select id="filter-merk" onchange="renderGrid()">
                    <option value="">Alle merken</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Bouwjaar</h3>
                <select id="filter-bouwjaar" onchange="renderGrid()">
                    <option value="">Alle bouwjaren</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Status</h3>
                <select id="filter-status" onchange="renderGrid()">
                    <option value="">Alle statussen</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('listings')" id="tab-listings">Listings</div>
                <div class="tab" onclick="switchTab('auctions')" id="tab-auctions">Veilingen</div>
            </div>

            <div class="grid" id="product-grid">
                <p>Gegevens ophalen uit Google Sheets...</p>
            </div>
        </main>
    </div>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2MZR5mkooWA08Y3GcQAbkAK_SjN0lORb5mth5VVI0fu54XFjksN9HFH_drlAii3O3MYNiCz0OvLbZ/pub?gid=0&single=true&output=csv';
        
        let allData = [];
        let currentTab = 'listings';

        Papa.parse(sheetCSVUrl, {
            download: true,
            header: true,
            complete: function(results) {
                allData = results.data.filter(row => row.Merk && row.Model);
                populateFilters();
                renderGrid();
            },
            error: function(err) {
                document.getElementById('product-grid').innerHTML = `<p style="color:red;">Fout bij laden van Google Sheet: ${err.message}</p>`;
            }
        });

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-listings').classList.toggle('active', tab === 'listings');
            document.getElementById('tab-auctions').classList.toggle('active', tab === 'auctions');
            renderGrid();
        }

        function populateFilters() {
            const platforms = [...new Set(allData.map(item => item.Platform))].filter(Boolean).sort();
            const merken = [...new Set(allData.map(item => item.Merk))].filter(Boolean).sort();
            const bouwjaren = [...new Set(allData.map(item => item.Bouwjaar))].filter(Boolean).sort((a,b)=>b-a);
            const statussen = [...new Set(allData.map(item => item.Status))].filter(Boolean).sort();

            const fillSelect = (id, arr) => {
                const select = document.getElementById(id);
                if (id === 'filter-platform') select.innerHTML = '<option value="">Alle platforms</option>';
                if (id === 'filter-merk') select.innerHTML = '<option value="">Alle merken</option>';
                if (id === 'filter-bouwjaar') select.innerHTML = '<option value="">Alle bouwjaren</option>';
                if (id === 'filter-status') select.innerHTML = '<option value="">Alle statussen</option>';

                arr.forEach(val => select.innerHTML += `<option value="${val}">${val}</option>`);
            };

            fillSelect('filter-platform', platforms);
            fillSelect('filter-merk', merken);
            fillSelect('filter-bouwjaar', bouwjaren);
            fillSelect('filter-status', statussen);
        }

        function getCountdown(endTimeString) {
            if (!endTimeString || endTimeString.trim() === '') return null;
            const end = new Date(endTimeString);
            if (isNaN(end.getTime())) return null;

            const now = new Date();
            const diff = end - now;

            if (diff <= 0) return 'Veiling afgelopen';

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);

            if (days > 0) return `Nog ${days}d ${hours}u`;
            return `Nog ${hours}u ${minutes}m`;
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filterPlatform = document.getElementById('filter-platform').value;
            const filterMerk = document.getElementById('filter-merk').value;
            const filterBouwjaar = document.getElementById('filter-bouwjaar').value;
            const filterStatus = document.getElementById('filter-status').value;

            const filteredData = allData.filter(row => {
                // Veiling check: Als kolom O ('Veiling loopt af op') gevuld is, is het een veiling
                const endDateVal = row['Veiling loopt af op'] ? row['Veiling loopt af op'].trim() : '';
                const isAuction = endDateVal !== '';

                if (currentTab === 'listings' && isAuction) return false;
                if (currentTab === 'auctions' && !isAuction) return false;

                if (filterPlatform && row.Platform !== filterPlatform) return false;
                if (filterMerk && row.Merk !== filterMerk) return false;
                if (filterBouwjaar && row.Bouwjaar !== filterBouwjaar) return false;
                if (filterStatus && row.Status !== filterStatus) return false;

                return true;
            });

            if (filteredData.length === 0) {
                grid.innerHTML = '<p>Geen machines gevonden met deze filters.</p>';
                return;
            }

            filteredData.forEach(row => {
                const endDateVal = row['Veiling loopt af op'] ? row['Veiling loopt af op'].trim() : '';
                const isAuction = endDateVal !== '';

                // Prijs logica: Eerste prijs (F) of Laatste prijs (G), anders Actueel bod / Op aanvraag
                let priceHtml = '';
                const eerstePrijs = row['Eerste prijs'] ? row['Eerste prijs'].trim() : '';
                const laatstePrijs = row['Laatste prijs'] ? row['Laatste prijs'].trim() : '';

                if (laatstePrijs && eerstePrijs && eerstePrijs !== laatstePrijs) {
                    priceHtml = `<div class="card-price"><span class="old-price">${eerstePrijs}</span> <span class="new-price">${laatstePrijs}</span></div>`;
                } else if (laatstePrijs) {
                    priceHtml = `<div class="card-price">${laatstePrijs}</div>`;
                } else if (eerstePrijs) {
                    priceHtml = `<div class="card-price">${eerstePrijs}</div>`;
                } else {
                    priceHtml = `<div class="card-price">${isAuction ? 'Actueel bod' : 'Op aanvraag'}</div>`;
                }

                // Veiling countdown
                let auctionHtml = '';
                if (isAuction) {
                    const countdownText = getCountdown(row['Veiling loopt af op']);
                    if (countdownText) {
                        const bidsCount = row['Aantal biedingen'] || '0';
                        auctionHtml = `<div class="countdown">⏱ ${countdownText} | Biedingen: ${bidsCount}</div>`;
                    }
                }

                // Badge / Status logica
                let badgeHtml = '';
                if (row.Status) {
                    let statusLower = row.Status.toLowerCase().trim();
                    let badgeClass = 'badge-default';

                    // "Op voorraad" mag nooit getoond worden bij veilingen
                    if (statusLower.includes('voorraad')) {
                        if (!isAuction) {
                            badgeClass = 'badge-op-voorraad';
                            badgeHtml = `<div class="badge ${badgeClass}">${row.Status}</div>`;
                        }
                    } else if (statusLower.includes('afgeprijsd') || statusLower.includes('bod verhoogd')) {
                        badgeClass = 'badge-rood';
                        badgeHtml = `<div class="badge ${badgeClass}">${row.Status}</div>`;
                    } else {
                        badgeHtml = `<div class="badge badge-default">${row.Status}</div>`;
                    }
                }

                // Afbeelding logica (ondersteunt Image URL, image url of image_url)
                let imageUrl = row['Image URL'] || row['image url'] || row['image_url'] || '';
                let imageHtml = `<div class="card-image-placeholder">Geen afbeelding</div>`;
                if (imageUrl.trim() !== '') {
                    imageHtml = `<div class="card-image"><img src="${imageUrl.trim()}" alt="${row.Merk} ${row.Model}" style="width:100%; height:180px; object-fit:cover; display:block;" onerror="this.parentElement.innerHTML='<div class=\'card-image-placeholder\'>Afbeelding laadt niet</div>'"></div>`;
                }

                const card = `
                    <div class="card">
                        ${badgeHtml}
                        ${imageHtml}
                        <div class="card-content">
                            <h3 class="card-title">${row.Merk} ${row.Model}</h3>
                            <div class="card-specs">
                                ${row.Bouwjaar ? `<span class="spec-tag">Bouwjaar: ${row.Bouwjaar}</span>` : ''}
                                ${row.Draaiuren ? `<span class="spec-tag">Uren: ${row.Draaiuren}</span>` : ''}
                            </div>
                            <div class="card-price-box">
                                ${priceHtml}
                            </div>
                            ${auctionHtml}
                            ${row.Link ? `<a href="${row.Link}" target="_blank" class="card-link">Bekijk machine</a>` : ''}
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        setInterval(() => {
            if (currentTab === 'auctions') {
                renderGrid();
            }
        }, 60000);
    </script>
</body>
</html>
