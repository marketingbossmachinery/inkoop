<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Equipment Platform - Boss Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --boss-red: #cc2027;
            --boss-black: #111111;
            --boss-gray: #f4f4f4;
            --text-dark: #333;
            --text-light: #777;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--boss-gray);
            color: var(--text-dark);
        }

        header {
            background-color: var(--boss-black);
            color: #fff;
            padding: 15px 40px;
            border-bottom: 4px solid var(--boss-red);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        .filter-group {
            background: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter-group h3 {
            margin-top: 0;
            font-size: 15px;
            border-bottom: 2px solid var(--boss-gray);
            padding-bottom: 8px;
            color: var(--boss-black);
            text-transform: uppercase;
        }

        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }

        .main-content {
            flex-grow: 1;
        }

        .tabs-header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 12px 25px;
            background-color: #fff;
            border: 1px solid #ddd;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 14px;
        }

        .tab.active {
            background-color: var(--boss-red);
            color: #fff;
            border-color: var(--boss-red);
        }

        .ai-header-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .ai-header-btn:hover { background: #1d4ed8; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            position: relative;
            display: flex;
            flex-direction: column;
            border-top: 3px solid transparent;
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-3px);
            border-top-color: var(--boss-red);
        }

        .card.expired {
            opacity: 0.55;
            background-color: #e9e9e9;
        }
        .card.expired:hover {
            transform: none;
            border-top-color: transparent;
        }

        .card-image-container {
            position: relative;
            height: 180px;
            background-color: #e9e9e9;
        }

        .card-image-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
            font-weight: bold;
        }

        .badge-image {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            font-weight: 900;
            z-index: 2;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .badge-status {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
            z-index: 2;
            color: #fff;
        }

        .badge-op-voorraad { background-color: #28a745; }
        .badge-rood { background-color: var(--boss-red); }
        .badge-default { background-color: var(--boss-black); }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 17px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--boss-black);
            line-height: 1.3;
        }

        .card-specs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-light);
            flex-wrap: wrap;
        }

        .spec-tag {
            background: var(--boss-gray);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .card-location {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-location img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 2px;
        }

        .card-price-box {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
            margin-bottom: 10px;
        }

        .card-price {
            font-size: 20px;
            font-weight: 900;
            color: var(--boss-black);
        }

        .old-price {
            text-decoration: line-through;
            color: #999;
            font-size: 14px;
            margin-right: 8px;
        }

        .new-price { color: var(--boss-red); }

        .countdown-box {
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .countdown-urgent {
            background-color: #fff3f3;
            border: 1px solid var(--boss-red);
            color: var(--boss-red);
        }

        .countdown-future {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            color: #555;
        }

        .countdown-expired {
            background-color: #eee;
            border: 1px solid #ccc;
            color: #666;
        }

        .card-link {
            display: block;
            text-align: center;
            background: var(--boss-black);
            color: #fff;
            text-decoration: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .card:hover .card-link {
            background: var(--boss-red);
        }
        
        .card.expired:hover .card-link {
            background: var(--boss-black); /* Blijft zwart bij expired */
        }

        /* Stijl voor vergelijkbare voertuigen op eigen voorraad kaartjes */
        .comparable-market-box {
            margin-top: 10px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
            color: var(--text-dark);
        }
        .comparable-market-box h4 {
            margin: 0 0 5px 0;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-light);
            border-bottom: 1px solid #ddd;
            padding-bottom: 3px;
        }
        .market-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .market-item a {
            color: var(--boss-red);
            text-decoration: none;
            font-weight: bold;
        }
        .market-item a:hover { text-decoration: underline; }

    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="BOSS GLOBAL" style="height: 45px; object-fit: contain; display: block;">
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Platform</h3>
                <select id="filter-platform" onchange="renderGrid()">
                    <option value="">Alle platformen</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Merk</h3>
                <select id="filter-merk" onchange="renderGrid()">
                    <option value="">Alle merken</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Bouwjaar</h3>
                <select id="filter-bouwjaar" onchange="renderGrid()">
                    <option value="">Alle bouwjaren</option>
                </select>
            </div>
            <div class="filter-group">
                <h3>Status</h3>
                <select id="filter-status" onchange="renderGrid()">
                    <option value="">Alle statussen</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <div class="tabs-header-area">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('listings')" id="tab-listings">Listings</div>
                    <div class="tab" onclick="switchTab('auctions')" id="tab-auctions">Veilingen</div>
                    <div class="tab" onclick="switchTab('voorraad')" id="tab-voorraad">Eigen Voorraad</div>
                </div>
                <button class="ai-header-btn" onclick="alert('AI Marktselectie functie wordt klaargezet voor latere implementatie!')">
                    🤖 AI Marktadvies
                </button>
            </div>

            <div class="grid" id="product-grid">
                <p>Gegevens ophalen uit Google Sheets...</p>
            </div>
        </main>
    </div>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2MZR5mkooWA08Y3GcQAbkAK_SjN0lORb5mth5VVI0fu54XFjksN9HFH_drlAii3O3MYNiCz0OvLbZ/pub?gid=0&single=true&output=csv';
        
        let allData = [];
        let currentTab = 'listings';

        Papa.parse(sheetCSVUrl, {
            download: true,
            header: true,
            complete: function(results) {
                allData = results.data.filter(row => row.Merk && row.Model);
                populateFilters();
                renderGrid();
            },
            error: function(err) {
                document.getElementById('product-grid').innerHTML = `<p style="color:red;">Fout bij laden van Google Sheet: ${err.message}</p>`;
            }
        });

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-listings').classList.toggle('active', tab === 'listings');
            document.getElementById('tab-auctions').classList.toggle('active', tab === 'auctions');
            document.getElementById('tab-voorraad').classList.toggle('active', tab === 'voorraad');
            populateFilters();
            renderGrid();
        }

        function populateFilters() {
            // Filter logica voor dropdowns op basis van actieve tab
            const tabData = allData.filter(row => {
                const isOwn = (row.Platform || '').toLowerCase().includes('eigen voorraad') || (row.Platform || '').toLowerCase().includes('boss');
                const isAuc = (row['Veiling loopt af op'] || '').trim() !== '';
                if(currentTab === 'voorraad') return isOwn;
                if(currentTab === 'auctions') return !isOwn && isAuc;
                return !isOwn && !isAuc;
            });

            const platforms = [...new Set(tabData.map(item => item.Platform))].filter(Boolean).sort();
            const merken = [...new Set(tabData.map(item => item.Merk))].filter(Boolean).sort();
            const bouwjaren = [...new Set(tabData.map(item => item.Bouwjaar))].filter(Boolean).sort((a,b)=>b-a);
            const statussen = [...new Set(tabData.map(item => item.Status))].filter(Boolean).sort();

            const fillSelect = (id, arr, label) => {
                const select = document.getElementById(id);
                select.innerHTML = `<option value="">${label}</option>`;
                arr.forEach(val => select.innerHTML += `<option value="${val}">${val}</option>`);
            };

            fillSelect('filter-platform', platforms, 'Alle platformen');
            fillSelect('filter-merk', merken, 'Alle merken');
            fillSelect('filter-bouwjaar', bouwjaren, 'Alle bouwjaren');
            fillSelect('filter-status', statussen, 'Alle statussen');
        }

        // Uitgebreide land/stad herkenning
        function getCountryFlagHtml(locStr) {
            if (!locStr) return '';
            let l = locStr.toLowerCase();
            let countryCode = '';

            if (l.includes('netherlands') || l.includes('nederland') || l.includes('holland') || l.includes(', nl') || l.includes('groot-ammers') || l.includes('moerdijk') || l.includes('amsterdam') || l.includes('barneveld')) {
                countryCode = 'nl';
            } else if (l.includes('germany') || l.includes('duitsland') || l.includes('deutschland') || l.includes(', de') || l.includes('schwabhausen') || l.includes('meppen') || l.includes('dormagen') || l.includes('nürnberg') || l.includes('münchen') || l.includes('berlin')) {
                countryCode = 'de';
            } else if (l.includes('slovenia') || l.includes('slovenië') || l.includes(', si') || l.includes('ajdovscina')) {
                countryCode = 'si';
            } else if (l.includes('france') || l.includes('frankrijk') || l.includes(', fr') || l.includes('paris') || l.includes('lyon')) {
                countryCode = 'fr';
            } else if (l.includes('belgium') || l.includes('belgië') || l.includes('belgique') || l.includes(', be') || l.includes('antwerpen') || l.includes('brussel')) {
                countryCode = 'be';
            } else if (l.includes('italy') || l.includes('italië') || l.includes('italia') || l.includes(', it') || l.includes('gorgonzola') || l.includes('verona') || l.includes('milan')) {
                countryCode = 'it';
            } else if (l.includes('spain') || l.includes('spanje') || l.includes('españa') || l.includes(', es') || l.includes('madrid') || l.includes('barcelona') || l.includes('valencia')) {
                countryCode = 'es';
            } else if (l.includes('poland') || l.includes('polen') || l.includes(', pl') || l.includes('poznan') || l.includes('warsaw')) {
                countryCode = 'pl';
            }

            if (countryCode) {
                return `<img src="https://flagcdn.com/24x18/${countryCode}.png" alt="${countryCode}">`;
            }
            return '📍';
        }

        // Vind de top 3 vergelijkbare voertuigen op basis van merk en model
        function getSimilarMarketVehicles(targetMerk, targetModel) {
            if(!targetMerk) return [];
            targetMerk = targetMerk.toLowerCase();
            targetModel = (targetModel || '').toLowerCase().replace(/[^a-z0-9]/g, '');

            return allData.filter(r => {
                const plat = (r.Platform || '').toLowerCase();
                if (plat.includes('eigen voorraad') || plat.includes('boss')) return false;
                
                const mMerk = (r.Merk || '').toLowerCase();
                const mModel = (r.Model || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                
                return mMerk === targetMerk && (targetModel === '' || mModel.includes(targetModel));
            }).slice(0, 3);
        }

        function parseAuctionDate(str) {
            if (!str) return null;
            str = String(str).replace(/^'/, '').trim();
            if (str.includes('T')) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) return d;
            }
            if (/^\d+:\d{2}:\d{2}$/.test(str)) {
                const parts = str.split(':').map(Number);
                const ms = (parts[0] * 3600 + parts[1] * 60 + parts[2]) * 1000;
                return new Date(Date.now() + ms);
            }
            const euMatch = str.match(/^(\d{2})-(\d{2})-(\d{4})[, ]*\s*(\d{2}):(\d{2})$/);
            if (euMatch) {
                const [, d, m, y, hh, mm] = euMatch;
                return new Date(`${y}-${m}-${d}T${hh}:${mm}:00`);
            }
            return null;
        }

        function getAuctionLogic(endTimeString) {
            const end = parseAuctionDate(endTimeString);
            if (!end) return null;
            
            const now = new Date();
            const diff = end - now;
            
            if (diff <= 0) {
                return { type: 'expired', boxText: 'Veiling afgelopen', imageBadge: 'AFGELOPEN' };
            }
            
            const pad = (n) => String(n).padStart(2, '0');
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            
            // Binnen 24 uur -> Urgent / Rode live timer
            if (days < 1) {
                const timeStr = `${pad(hours)}u ${pad(minutes)}m ${pad(seconds)}s`;
                const timeStrUpper = `${pad(hours)}U ${pad(minutes)}M ${pad(seconds)}S`;
                return { 
                    type: 'urgent', 
                    boxText: `⚠️ ${timeStr}`, 
                    imageBadge: `⚠️ ${timeStrUpper}` 
                };
            } 
            // Verder in de toekomst -> Gewoon de datum (Grijze box, geen label op foto)
            else {
                const d = pad(end.getDate());
                const m = pad(end.getMonth() + 1);
                const y = end.getFullYear();
                const H = pad(end.getHours());
                const M = pad(end.getMinutes());
                return { 
                    type: 'future', 
                    boxText: `Veiling: ${d}-${m}-${y} ${H}:${M}`, 
                    imageBadge: null 
                };
            }
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filterPlatform = document.getElementById('filter-platform').value;
            const filterMerk = document.getElementById('filter-merk').value;
            const filterBouwjaar = document.getElementById('filter-bouwjaar').value;
            const filterStatus = document.getElementById('filter-status').value;

            // Voorbereken vergelijkbare items voor Eigen Voorraad sortering
            if (currentTab === 'voorraad') {
                allData.forEach(row => {
                    const isOwnStock = (row.Platform || '').toLowerCase().includes('eigen voorraad') || (row.Platform || '').toLowerCase().includes('boss');
                    if (isOwnStock) {
                        row._similarCount = getSimilarMarketVehicles(row.Merk, row.Model).length;
                    }
                });
            }

            let filteredData = allData.filter(row => {
                const platformVal = (row.Platform || '').toLowerCase();
                const isOwnStock = platformVal.includes('eigen voorraad') || platformVal.includes('boss');
                const endDateVal = row['Veiling loopt af op'] ? row['Veiling loopt af op'].trim() : '';
                const isAuction = endDateVal !== '';

                if (currentTab === 'voorraad' && !isOwnStock) return false;
                if (currentTab === 'listings' && (isOwnStock || isAuction)) return false;
                if (currentTab === 'auctions' && (isOwnStock || !isAuction)) return false;

                if (filterPlatform && row.Platform !== filterPlatform) return false;
                if (filterMerk && row.Merk !== filterMerk) return false;
                if (filterBouwjaar && row.Bouwjaar !== filterBouwjaar) return false;
                if (filterStatus && row.Status !== filterStatus) return false;

                return true;
            });

            // Sortering
            if (currentTab === 'voorraad') {
                // Sorteer op aantal vergelijkbare marktitems (meeste eerst)
                filteredData.sort((a, b) => (b._similarCount || 0) - (a._similarCount || 0));
            } else if (currentTab === 'auctions') {
                // Sorteer veilingen op tijd (eerstkomende bovenaan, afgelopen onderaan)
                filteredData.sort((a, b) => {
                    const dateA = parseAuctionDate(a['Veiling loopt af op']);
                    const dateB = parseAuctionDate(b['Veiling loopt af op']);
                    const now = new Date();
                    const isExpiredA = !dateA || (dateA - now <= 0);
                    const isExpiredB = !dateB || (dateB - now <= 0);
                    if (isExpiredA && !isExpiredB) return 1;
                    if (!isExpiredA && isExpiredB) return -1;
                    if (!dateA) return 1;
                    if (!dateB) return -1;
                    return dateA - dateB;
                });
            } else if (currentTab === 'listings') {
                // Sorteer 'Verkocht' onderaan
                filteredData.sort((a, b) => {
                    const isSoldA = (a.Status || '').toLowerCase().includes('verkocht');
                    const isSoldB = (b.Status || '').toLowerCase().includes('verkocht');
                    if (isSoldA && !isSoldB) return 1;
                    if (!isSoldA && isSoldB) return -1;
                    return 0;
                });
            }

            if (filteredData.length === 0) {
                grid.innerHTML = '<p>Geen machines gevonden met deze filters.</p>';
                return;
            }

            filteredData.forEach(row => {
                const platformVal = (row.Platform || '').toLowerCase();
                const isOwnStock = platformVal.includes('eigen voorraad') || platformVal.includes('boss');
                const endDateVal = row['Veiling loopt af op'] ? row['Veiling loopt af op'].trim() : '';
                const isAuction = endDateVal !== '';

                // Volledige titel genereren
                const fullTitle = row.Titel || row.Title || (`${row.Merk} ${row.Model}`);

                // Prijs logica
                let priceHtml = '';
                const eerstePrijs = row['Eerste prijs'] ? row['Eerste prijs'].trim() : '';
                const laatstePrijs = row['Laatste prijs'] ? row['Laatste prijs'].trim() : '';

                if (laatstePrijs && eerstePrijs && eerstePrijs !== laatstePrijs) {
                    priceHtml = `<span class="old-price">${eerstePrijs}</span> <span class="new-price">${laatstePrijs}</span>`;
                } else if (laatstePrijs) {
                    priceHtml = laatstePrijs;
                } else if (eerstePrijs) {
                    priceHtml = eerstePrijs;
                } else {
                    priceHtml = isAuction ? 'Actueel bod' : 'Op aanvraag';
                }

                // Veiling & Badge logica
                let statusBadge = '';
                let imageBadge = '';
                let auctionBoxHtml = '';
                let isExpired = false;

                if (isOwnStock) {
                    statusBadge = `<div class="badge-status badge-op-voorraad">Eigen Voorraad</div>`;
                } else if (isAuction) {
                    const auctionDetails = getAuctionLogic(row['Veiling loopt af op']);
                    if (auctionDetails) {
                        const bidsCount = row['Aantal biedingen'] || '0';
                        
                        if (auctionDetails.type === 'expired') {
                            isExpired = true;
                            imageBadge = `<div class="badge-image" style="color:var(--boss-red);">AFGELOPEN</div>`;
                            auctionBoxHtml = `<div class="countdown-box countdown-expired">${auctionDetails.boxText}</div>`;
                        } else if (auctionDetails.type === 'urgent') {
                            imageBadge = `<div class="badge-image" style="color:#ffc107;">${auctionDetails.imageBadge}</div>`;
                            auctionBoxHtml = `<div class="countdown-box countdown-urgent">${auctionDetails.boxText} | Biedingen: ${bidsCount}</div>`;
                        } else {
                            // Toekomst
                            auctionBoxHtml = `<div class="countdown-box countdown-future">${auctionDetails.boxText} | Biedingen: ${bidsCount}</div>`;
                        }
                    }
                } else if (row.Status) {
                    let statusLower = row.Status.toLowerCase().trim();
                    let badgeClass = 'badge-default';
                    if (statusLower.includes('voorraad')) badgeClass = 'badge-op-voorraad';
                    else if (statusLower.includes('afgeprijsd') || statusLower.includes('bod verhoogd')) badgeClass = 'badge-rood';
                    statusBadge = `<div class="badge-status ${badgeClass}">${row.Status}</div>`;
                }

                // Afbeelding
                let imageUrl = row['Image URL'] || row['image url'] || row['image_url'] || '';
                let imageHtml = `<div class="card-image-placeholder">Geen afbeelding</div>`;
                if (imageUrl.trim() !== '') {
                    imageHtml = `<img src="${imageUrl.trim()}" alt="${row.Merk} ${row.Model}" style="width:100%; height:180px; object-fit:cover; display:block;" onerror="this.parentElement.innerHTML='<div class=\\'card-image-placeholder\\'>Geen afbeelding</div>'">`;
                }

                // Locatie
                let locationHtml = '';
                if (row['Locatie']) {
                    let flagHtml = getCountryFlagHtml(row['Locatie']);
                    locationHtml = `<div class="card-location">${flagHtml} <span>${row['Locatie']}</span></div>`;
                }

                // Extra content (Vergelijkbare box voor voorraad)
                let extraContent = '';
                if (isOwnStock) {
                    const similar = getSimilarMarketVehicles(row.Merk, row.Model);
                    let marketList = '';
                    if (similar.length > 0) {
                        similar.forEach(v => {
                            marketList += `
                                <div class="market-item">
                                    <span>${v.Bouwjaar || '-'} | ${v.Draaiuren || '-'} | <strong>${v['Laatste prijs'] || v['Eerste prijs'] || 'Op aanvraag'}</strong></span>
                                    <a href="${v.Link || '#'}" target="_blank">Bekijk</a>
                                </div>
                            `;
                        });
                    } else {
                        marketList = `<div style="color:#777; font-style:italic;">Geen vergelijkbare marktdata gevonden.</div>`;
                    }
                    extraContent = `
                        <div class="comparable-market-box">
                            <h4>Vergelijkbaar in markt:</h4>
                            ${marketList}
                        </div>
                    `;
                }

                // Kaart opbouw (Geheel klikbaar als link)
                const productUrl = row.Link ? row.Link : '#';
                const expiredClass = isExpired ? ' expired' : '';
                const pointerStyle = isOwnStock ? 'cursor:default;' : '';
                // Voorraad is een div, Listings/Auctions zijn a tags
                const wrapperStart = isOwnStock ? `<div class="card${expiredClass}">` : `<a href="${productUrl}" target="_blank" rel="noopener noreferrer" class="card${expiredClass}">`;
                const wrapperEnd = isOwnStock ? `</div>` : `</a>`;

                const cardHtml = `
                    ${wrapperStart}
                        ${statusBadge}
                        <div class="card-image-container">
                            ${imageHtml}
                            ${imageBadge}
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${fullTitle}</h3>
                            <div class="card-specs">
                                ${row.Bouwjaar ? `<span class="spec-tag">Bouwjaar: ${row.Bouwjaar}</span>` : ''}
                                ${row.Draaiuren ? `<span class="spec-tag">Uren: ${row.Draaiuren}</span>` : ''}
                            </div>
                            ${locationHtml}
                            
                            <div class="card-price-box">
                                <div class="card-price">${priceHtml}</div>
                            </div>
                            
                            ${auctionBoxHtml}
                            
                            ${!isOwnStock ? `<div class="card-link">BEKIJK MACHINE</div>` : ''}
                            ${extraContent}
                        </div>
                    ${wrapperEnd}
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // Live timer update per seconde (Alleen als Veilingen tab actief is)
        setInterval(() => {
            if (currentTab === 'auctions') {
                renderGrid();
            }
        }, 1000);
    </script>
</body>
</html>
