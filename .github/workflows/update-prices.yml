name: Update Live Auction Prices

on:
  schedule:
    # Draait automatisch elke 5 minuten
    - cron: '*/5 * * * *'
  workflow_dispatch: # Zodat je hem ook handmatig kunt testen in GitHub

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run price update script
        run: node scripts/update-prices.js

      - name: Commit and push updated prices
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add data/equipment-data.json
          git commit -m "Auto-update live auction prices [skip ci]" || exit 0
          git push
